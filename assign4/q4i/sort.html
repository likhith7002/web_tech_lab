<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function generateBoxes() {
            var n = document.getElementById("count").value;
            var container = document.getElementById("numberBoxes");
            if(n <= 0) {
                alert("Please enter a valid positive number.");
                return;
            }
            container.innerHTML = "";
            for (var i = 1; i <= n; i++) {
                container.innerHTML += "Number " + i + ": <input type='text' name='num[]' required><br>";
            }
            document.getElementById("submitBtn").style.display = "inline";
        }
    </script>
    <h2>Sort N Numbers</h2>
    How many numbers (N)?
    <input type="text" id="count">
    <button type="button" onclick="generateBoxes()">Generate Boxes</button>
    <br><br>

    <form action="sort.php" method="post">
        <div id="numberBoxes"></div>
        <br>
        <input type="submit" id="submitBtn" value="Sort" style="display:none;">
    </form>
</body>

</html>
