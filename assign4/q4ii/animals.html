<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <title>Animal Names</title>
    <script>
        // JS function to create N input boxes for animal names
        function generateBoxes() {
            var n = document.getElementById("count").value;
            var container = document.getElementById("nameBoxes");
            container.innerHTML = "";
            for (var i = 1; i <= n; i++) {
                container.innerHTML += "Animal " + i + " name: <input type='text' name='animal[]'><br>";
            }
            document.getElementById("submitBtn").style.display = "inline";
        }
    </script>
</head>
<body>
    <h2>Display N Animal Names</h2>
    How many animals (N)?
    <input type="text" id="count">
    <button type="button" onclick="generateBoxes()">Generate Boxes</button>
    <br><br>
 
    <form action="4ii_animals.php" method="post">
        <div id="nameBoxes"></div>
        <br>
        <input type="submit" id="submitBtn" value="Show Animals" style="display:none;">
    </form>
</body>
</html>
