<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Student Search</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Student Records</h1>

        <p>Search student records as you type.</p>

        <!-- Search Box -->
        <input
            type="text"
            id="search"
            placeholder="Search by name or department..."
            autocomplete="off"
        >

        <!-- Table will be displayed here -->
        <div id="result">
            <p>Start typing to search records.</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
